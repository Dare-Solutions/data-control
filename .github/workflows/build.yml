name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Compiler aussi pour iOS (runner macOS, plus coûteux)"
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  android:
    name: Tests + APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Construire l'APK
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build.log; then
            # Les erreurs de compilation remontent en annotations, lisibles sans le journal complet.
            grep -E "^e: |error:|What went wrong|Execution failed|> .*failed" build.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Vérifier qu'aucune permission Internet n'est demandée
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::L'APK demande la permission INTERNET"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: flux-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  aab:
    name: AAB signé pour Google Play
    runs-on: ubuntu-latest
    # Seulement quand la clé d'envoi est dans les secrets du dépôt.
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
    steps:
      - name: Vérifier la présence de la clé d'envoi
        id: key
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "::notice::Pas de clé d'envoi dans les secrets (UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD) : AAB non construit."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-java@v6
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.present == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Installer la clé d'envoi
        if: steps.key.outputs.present == 'true'
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Construire l'AAB
        if: steps.key.outputs.present == 'true'
        run: |
          flutter pub get
          set -o pipefail
          if ! flutter build appbundle --release 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Execution failed" build.log | head -10 | while read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Vérifier la signature
        if: steps.key.outputs.present == 'true'
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256" | head -3

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.present == 'true'
        with:
          name: flux-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

  ios:
    name: Compilation iOS (sans signature)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
